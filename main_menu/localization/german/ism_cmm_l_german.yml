l_german:
 # Mod
 ism_name: "Verbesserte Untertanenverwaltung"
 ism_desc: "Fügt neue Interaktionen, Modifikationen und Automatisierungen hinzu, um die Untertanenverwaltung deutlich zu verbessern."

 # QoL (qol) Tab
 ism__qol_name: "Lebensqualität"
 ## Automations (automations) Group
 ism__qol__automations_name: "Automatisierungen"
 ism__auto_take_over_subject_wars_name: "Automatisch an Untertanenkriegen teilnehmen"
 ism__auto_take_over_subject_wars_desc: "Wenn aktiviert, werdet Ihr jedes Jahr automatisch allen Kriegen Eurer Untertanen beitreten und, wenn möglich, die Führung übernehmen."
 ism__auto_subject_map_sharing_name: "Untertanenkarten automatisch teilen"
 ism__auto_subject_map_sharing_desc: "Die Karten Eurer Untertanen werden sich jedes Jahr allmählich auf Euch ausbreiten."
 ## Subject Rights (subject_rights) Group
 ism__qol__subject_rights_name: "Untertanenrechte"
 ism__qol__subject_rights_desc: "Dies sind die Rechte, die Ihr Euren Untertanen gewährt."
 ism__block_colonization_name: "Kolonisierung blockieren"
 ism__block_colonization_desc: "Verhindert, dass alle Eure Untertanen kolonisieren."
 ism__block_urbanization_name: "Urbanisierung blockieren"
 ism__block_urbanization_desc: "Verhindert, dass alle Eure Untertanen ländliche Standorte zu Städten ausbauen."
 ism__block_columbian_exchange_name: "Kolumbianischen Austausch blockieren"
 ism__block_columbian_exchange_desc: "Untersagt all Euren Untertanen die Nutzung des Kolumbianischen Austauschs, sofern dieser verfügbar ist."
 ism__block_declaring_war_name: "Kriegserklärungen unterbinden"
 ism__block_declaring_war_desc: "Verhindert, dass all Eure Untertanen Kriege erklären."

 # Optional: self-referencing flag keys to suppress IDE warnings (safe to remove if you want)
 ism: "ism"
 ism__qol: "ism__qol"
 ism__qol__automations: "ism__qol__automations"
