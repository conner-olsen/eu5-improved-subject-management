l_german:
 # Note to translators: The `#E #!` and `#F #!` prefixes are just used to order the interactions in the list.
 # Options
 select_country_to_transfer_land_from: "Wählen Sie das [country|e] aus, aus dem Sie Land übertragen möchten:"
 select_country_to_transfer_land_to: "Wählen Sie das [country|e] aus, in das Sie Land übertragen möchten:"
 select_transfer_mode: "Übertragungsmodus auswählen"

 # Generic Land Transfer
 transfer_location_from_subject_select_title: "Wählen Sie einen Ort aus, an den Sie von unserem Thema übertragen möchten."
 transfer_province_from_subject_select_title: "Wählen Sie eine Provinz aus, um aus unserem Fach zu wechseln."
 transfer_area_from_subject_select_title: "Wählen Sie einen Bereich aus unserem Thema aus, den Sie übertragen möchten."
 transfer_region_from_subject_select_title: "Wählen Sie eine Region aus, aus der Sie aus unserem Fachbereich übertragen möchten."

 transfer_location_to_subject_select_title: "Wählen Sie einen Ort aus, an den Sie unser Thema übertragen möchten."
 transfer_province_to_subject_select_title: "Wählen Sie eine Provinz aus, um zu unserem Thema zu wechseln."
 transfer_area_to_subject_select_title: "Wählen Sie einen Bereich aus, der auf unser Thema übertragen werden soll."
 transfer_region_to_subject_select_title: "Wählen Sie eine Region aus, in die Sie unser Thema übertragen möchten."

 select_a_location_to_move_capital: "Klicken Sie hier, um einen [location|e] auszuwählen, an den wir das Kapital unseres Subjekts verlegen sollen."

 # Transfer Land to Subject
 ism_transfer_land_to_subject: "#E #!Grundstück übertragen an"
 ism_transfer_land_to_subject_desc: "Wir werden Land an unseren Untertan übertragen."
 ism_transfer_land_to_subject_act: "Land an [SCOPE.sCountry('recipient').GetName] übertragen"
 ism_transfer_land_to_subject_effect_text: "[SCOPE.sCountry('actor').GetName] überträgt Land an [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_to_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName] übertrug Land an [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_transfer_land_to_subject: "Land an $RECIPIENT$ übertragen?\n$INFO$."

 # Transfer Land from Subject
 ism_transfer_land_from_subject: "#E #!Grundstück übertragen von"
 ism_transfer_land_from_subject_desc: "Wir werden Land von unserem Untertan übertragen."
 ism_transfer_land_from_subject_act: "Land von [SCOPE.sCountry('recipient').GetName] übertragen"
 ism_transfer_land_from_subject_effect_text: "[SCOPE.sCountry('actor').GetName] wird Land von [SCOPE.sCountry('recipient').GetName] übertragen."
 ism_transfer_land_from_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName] übertrug Land von [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_transfer_land_from_subject: "Land von $RECIPIENT$ übertragen?\n$INFO$."

 # Move Subject Capital
 ism_move_subject_capital: "#F #!Move Capital"
 ism_move_subject_capital_desc: "Wir werden das Kapital unseres Subjekts an einen neuen [location|e] verlegen."
 ism_move_subject_capital_act: "Kapital nach [SCOPE.sCountry('target').GetName] verlagern"
 ism_move_subject_capital_effect_text: "Verlegen Sie die Hauptstadt [SCOPE.sCountry('target').GetName] an einen neuen Standort [location|e]."
 ism_move_subject_capital_effect_text_past: "Die Hauptstadt [SCOPE.sCountry('target').GetName] wurde an einen neuen Standort [location|e] verlegt."
 PROPOSE_ism_move_subject_capital: "Das Kapital des Subjekts auf $TARGET$?\n$INFO$ verschieben?"

 # Change Subject Liturgical Language
 ism_change_subject_liturgical_language: "Liturgische Sprache ändern"
 ism_change_subject_liturgical_language_desc: "Wir werden verlangen, dass sie unsere [liturgical_language|e] übernehmen!"
 ism_change_subject_liturgical_language_act: "Liturgische Sprache in [SCOPE.sCountry('recipient').GetName] ändern"
 ism_change_subject_liturgical_language_effect_text: "[SCOPE.sCountry('actor').GetName] Ändern Sie die [liturgical_language|e] in [SCOPE.sCountry('recipient').GetName]"
 ism_change_subject_liturgical_language_effect_text_past: "[SCOPE.sCountry('actor').GetName] hat die [liturgical_language|e] in [SCOPE.sCountry('recipient').GetName] geändert."
 PROPOSE_ism_change_subject_liturgical_language: "Ändern Sie [liturgical_language|e] in $RECIPIENT$?\n$INFO$."

 # Block subject colonization
 ism_block_subject_colonization: "Block-Kolonisierung"
 ism_block_subject_colonization_desc: "Wir werden verhindern, dass unser Subjekt neue [colonial_charters|e] erstellt."
 ism_block_subject_colonization_act: "Blöcke Kolonisierung"
 ism_block_subject_colonization_effect_text: "[SCOPE.sCountry('actor').GetName] verhindert die Kolonisierung von [SCOPE.sCountry('recipient').GetName]"
 ism_block_subject_colonization_effect_text_past: "[SCOPE.sCountry('actor').GetName] blockiert derzeit die Kolonisierung von [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_block_subject_colonization: "Blockierung der Kolonisierung von $TARGET$?"

 # Allow subject colonization
 allow_subject_colonization: "Kolonisierung zulassen"
 allow_subject_colonization_desc: "Wir werden unserem Subjekt erlauben, neue [colonial_charters|e] zu erstellen."
 allow_subject_colonization_act: "Erlaubt Kolonisierung"
 allow_subject_colonization_effect_text: "[SCOPE.sCountry('actor').GetName] ermöglicht die Kolonisierung von [SCOPE.sCountry('recipient').GetName]"
 allow_subject_colonization_effect_text_past: "[SCOPE.sCountry('actor').GetName] blockiert nicht mehr die Kolonisierung von [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_allow_subject_colonization: "Kolonisierung von $TARGET$ zulassen?"

 # Block subject urbanization
 ism_block_subject_urbanization: "Block-Urbanisierung"
 ism_block_subject_urbanization_desc: "Wir werden verhindern, dass unser Subjekt neue Städte gründet."
 ism_block_subject_urbanization_act: "Blöcke Urbanisierung"
 ism_block_subject_urbanization_effect_text: "[SCOPE.sCountry('actor').GetName] blockiert die Urbanisierung von [SCOPE.sCountry('recipient').GetName]"
 ism_block_subject_urbanization_effect_text_past: "[SCOPE.sCountry('actor').GetName] blockiert derzeit die Urbanisierung von [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_block_subject_urbanization: "Blockieren Sie die Urbanisierung von $TARGET$?"

 # Allow subject urbanization
 allow_subject_urbanization: "Urbanisierung zulassen"
 allow_subject_urbanization_desc: "Wir werden unserem Subjekt erlauben, neue Städte zu gründen."
 allow_subject_urbanization_act: "Ermöglicht Urbanisierung"
 allow_subject_urbanization_effect_text: "[SCOPE.sCountry('actor').GetName] ermöglicht die Urbanisierung von [SCOPE.sCountry('recipient').GetName]"
 allow_subject_urbanization_effect_text_past: "[SCOPE.sCountry('actor').GetName] blockiert nicht mehr die Urbanisierung von [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_allow_subject_urbanization: "Urbanisierung von $TARGET$ zulassen?"

 # Block subject declaring war
 ism_block_subject_declaring_war: "Block erklärt Krieg"
 ism_block_subject_declaring_war_desc: "Wir werden unseren Untertanen daran hindern, Krieg zu erklären."
 ism_block_subject_declaring_war_act: "Blöcke, die den Krieg erklären"
 ism_block_subject_declaring_war_effect_text: "[SCOPE.sCountry('actor').GetName] hindert [SCOPE.sCountry('recipient').GetName] daran, Krieg zu erklären."
 ism_block_subject_declaring_war_effect_text_past: "[SCOPE.sCountry('actor').GetName] hindert nun [SCOPE.sCountry('recipient').GetName] daran, den Krieg zu erklären."
 PROPOSE_ism_block_subject_declaring_war: "Blockieren Sie $TARGET$, Krieg zu erklären?"

 # Allow subject declaring war
 allow_subject_declaring_war: "Kriegserklärung zulassen"
 allow_subject_declaring_war_desc: "Wir werden unserem Untertanen erlauben, den Krieg zu erklären."
 allow_subject_declaring_war_act: "Erlaubt Kriegserklärung"
 allow_subject_declaring_war_effect_text: "[SCOPE.sCountry('actor').GetName] erlaubt [SCOPE.sCountry('recipient').GetName], den Krieg zu erklären."
 allow_subject_declaring_war_effect_text_past: "[SCOPE.sCountry('actor').GetName] hindert [SCOPE.sCountry('recipient').GetName] nicht mehr daran, Krieg zu erklären."
 PROPOSE_allow_subject_declaring_war: "Soll $TARGET$ den Krieg erklären dürfen?"
