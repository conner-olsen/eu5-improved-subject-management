 PROPOSE_ism_change_subject_liturgical_language: "[liturgical_language|e] in $RECIPIENT$ ändern?\n$INFO$"

 # Block subject colonization
 ism_block_subject_colonization: "Kolonisierung blockieren"
 ism_block_subject_colonization_desc: "Wir werden verhindern, dass unser Untertan neue [colonial_charters|e] erstellt."
