 ism_take_subject_troops: "#D #!Kommando über Truppen übernehmen"
 ism_take_subject_troops_desc: "Wir übernehmen das Kommando über eine der Armeen unseres Untertans, während wir gemeinsam einen Krieg führen. Unser Untertan kommt weiterhin für deren Unterhalt auf, und das Kommando kehrt zurück, wenn der gemeinsame Krieg endet oder falls ihre Loyalität zu tief sinkt."
 ism_take_subject_troops_act: "Kommando über Truppen von [SCOPE.sCountry('recipient').GetName] übernehmen"
