l_german:
 # Note to translators: The `#E #!` and `#F #!` prefixes are just used to order the interactions in the list.
 # Options
 select_country_to_transfer_land_from: "Wähle den [country|e] aus, dem du Land entziehen möchtest:"
 select_country_to_transfer_land_to: "Wählt den [country|e] aus, dem Ihr Land geben wollt:"
 select_transfer_mode: "Transfermodus auswählen"

 # Generic Land Transfer
 transfer_location_from_subject_select_title: "Wählt einen Ort aus, der von unserem Untertanen übertragen werden soll."
 transfer_province_from_subject_select_title: "Wählt eine Provinz aus, die von unserem Untertanen übertragen werden soll."
 transfer_area_from_subject_select_title: "Wählt ein Gebiet unseres Untertanen zur Übertragung aus."
 transfer_region_from_subject_select_title: "Wählt eine Region aus, die von unserem Untertanen übertragen werden soll."

 transfer_location_to_subject_select_title: "Wählt einen Ort aus, der an unseren Untertanen übertragen werden soll."
 transfer_province_to_subject_select_title: "Wählt eine Provinz aus, die an unseren Untertanen übertragen werden soll."
 transfer_area_to_subject_select_title: "Wählt ein Gebiet aus, das an unseren Untertanen übertragen werden soll."
 transfer_region_to_subject_select_title: "Wählt eine Region aus, die an unseren Untertan übertragen werden soll."

 select_a_location_to_move_capital: "Klickt, um eine [location|e] auszuwählen, in die wir die Hauptstadt unseres Untertans verlegen sollen."

 # Transfer Land to Subject
 ism_transfer_land_to_subject: "#E #!Land geben"
 ism_transfer_land_to_subject_desc: "Wir werden unserem Untertanen Land geben."
 ism_transfer_land_to_subject_act: "Land an [SCOPE.sCountry('recipient').GetName] geben"
 ism_transfer_land_to_subject_effect_text: "[SCOPE.sCountry('actor').GetName] wird [SCOPE.sCountry('recipient').GetName] Land geben"
 ism_transfer_land_to_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName] gab [SCOPE.sCountry('recipient').GetName] Land"
 PROPOSE_ism_transfer_land_to_subject: "Land an $RECIPIENT$ geben?\n$INFO$."

 # Transfer Land from Subject
 ism_transfer_land_from_subject: "#E #!Land nehmen"
 ism_transfer_land_from_subject_desc: "Wir werden Land von unserem Untertanen nehmen."
 ism_transfer_land_from_subject_act: "Land von [SCOPE.sCountry('recipient').GetName] nehmen"
 ism_transfer_land_from_subject_effect_text: "[SCOPE.sCountry('actor').GetName] wird Land von [SCOPE.sCountry('recipient').GetName] nehmen"
 ism_transfer_land_from_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName] nahm Land von [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_transfer_land_from_subject: "Land von $RECIPIENT$ nehmen?\n$INFO$"

 # Move Subject Capital
 ism_move_subject_capital: "#F #!Hauptstadt verlegen"
 ism_move_subject_capital_desc: "Wir werden die Hauptstadt unseres Untertanen in ein neues [location|e] verlegen."
 ism_move_subject_capital_act: "Hauptstadt nach [SCOPE.sCountry('target').GetName] verlegen"
 ism_move_subject_capital_effect_text: "Verlege die Hauptstadt von [SCOPE.sCountry('target').GetName] in ein neues [location|e]."
 ism_move_subject_capital_effect_text_past: "Die Hauptstadt von [SCOPE.sCountry('target').GetName] in ein neues [location|e] verlegt."
 PROPOSE_ism_move_subject_capital: "Die Hauptstadt des Untertans nach $TARGET$ verlegen?\n$INFO$"

 # Change Subject Liturgical Language
 ism_change_subject_liturgical_language: "Liturgiesprache ändern"
 ism_change_subject_liturgical_language_desc: "Wir werden fordern, dass sie unser [liturgical_language|e] annehmen!"
 ism_change_subject_liturgical_language_act: "Liturgiesprache in [SCOPE.sCountry('recipient').GetName] ändern"
 ism_change_subject_liturgical_language_effect_text: "[SCOPE.sCountry('actor').GetName] ändert [liturgical_language|e] in [SCOPE.sCountry('recipient').GetName]"
