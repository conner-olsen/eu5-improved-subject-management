 PROPOSE_ism_take_subject_troops: "Das Kommando über eine der Armeen von $TARGET$ übernehmen?"
 ism_take_subject_troops_choose_unit: "Wählt eine Armee aus, über die Ihr das Kommando übernehmen wollt"
 ism_take_subject_troops_no_units: "@trigger_no! Keine geeigneten Armeen verfügbar, um das Kommando zu übernehmen."
 ism_take_subject_troops_select_unit: "Klicken, um [army|e] auszuwählen, über das wir das Kommando übernehmen sollen."
 ism_return_subject_troops: "#D #!Truppen zurückgeben"
 ism_return_subject_troops_desc: "Wir werden den Oberbefehl über alle Armeen zurückgeben, die wir von unserem Untertanen übernommen haben."
 ism_return_subject_troops_act: "Truppen an [SCOPE.sCountry('recipient').GetName] zurückgeben"
 ism_return_subject_troops_effect_text: "[SCOPE.sCountry('actor').GetName] gibt alle übernommenen Armeen an [SCOPE.sCountry('recipient').GetName] zurück."
 ism_return_subject_troops_effect_text_past: "[SCOPE.sCountry('actor').GetName] hat alle übernommenen Armeen an [SCOPE.sCountry('recipient').GetName] zurückgegeben"
