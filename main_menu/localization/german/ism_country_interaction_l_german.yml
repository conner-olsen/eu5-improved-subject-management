l_german:
 # Note to translators: The `#E #!` and `#F #!` prefixes are just used to order the interactions in the list.
 # Options
 select_country_to_transfer_land_from: "Wählen Sie die [country|e], von der Sie Flächen übertragen möchten:"
 select_country_to_transfer_land_to: "Wählen Sie die [country|e], auf die Sie Flächen übertragen möchten:"
 select_transfer_mode: "Übertragungsmodus auswählen"

 # Generic Land Transfer
 transfer_location_from_subject_select_title: "Wählen Sie einen Ort für die Übertragung von unserem Thema."
 transfer_province_from_subject_select_title: "Wählen Sie eine Provinz aus, die Sie aus unserem Thema übertragen möchten."
 transfer_area_from_subject_select_title: "Wählen Sie einen Bereich, den Sie aus unserem Fachgebiet übertragen möchten."
 transfer_region_from_subject_select_title: "Wählen Sie eine Region aus, die Sie aus unserem Thema übertragen möchten."

 transfer_location_to_subject_select_title: "Wählen Sie einen Ort aus, um zu unserem Thema zu wechseln."
 transfer_province_to_subject_select_title: "Wählen Sie eine Provinz aus, um sie in unser Fach zu übertragen."
 transfer_area_to_subject_select_title: "Wählen Sie einen Bereich aus, den Sie in unser Fachgebiet übertragen möchten."
 transfer_region_to_subject_select_title: "Wählen Sie eine Region aus, die Sie in unser Thema aufnehmen möchten."

 select_a_location_to_move_capital: "Klicken Sie auf, um eine [location|e] auszuwählen, in die wir das Kapital unseres Subjekts verschieben sollen."

 # Transfer Land to Subject
 ism_transfer_land_to_subject: "#E #!Land übertragen an"
 ism_transfer_land_to_subject_desc: "Wir werden unserem Subjekt Land übertragen."
 ism_transfer_land_to_subject_act: "Übertragung von Land auf [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_to_subject_effect_text: "[SCOPE.sCountry('actor').GetName] wird Grundstücke an [SCOPE.sCountry('recipient').GetName] übertragen."
 ism_transfer_land_to_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName] hat Grundstücke an [SCOPE.sCountry('recipient').GetName] übertragen"
 PROPOSE_ism_transfer_land_to_subject: "Übertragung von Grundstücken auf $RECIPIENT$?\n$INFO$."

 # Transfer Land from Subject
 ism_transfer_land_from_subject: "#E #!Land übertragen von"
 ism_transfer_land_from_subject_desc: "Wir werden Land von unserem Subjekt übertragen."
 ism_transfer_land_from_subject_act: "Übertragung von Land aus [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_from_subject_effect_text: "[SCOPE.sCountry('actor').GetName] wird Flächen von [SCOPE.sCountry('recipient').GetName] übertragen"
 ism_transfer_land_from_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName] übertragene Grundstücke von [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_transfer_land_from_subject: "Übertragung von Flächen von $RECIPIENT$ auf $INFO$."

 # Move Subject Capital
 ism_move_subject_capital: "#F #!Kapital verschieben"
 ism_move_subject_capital_desc: "Wir werden das Kapital unseres Subjekts in eine neue [location|e] verschieben."
 ism_move_subject_capital_act: "Kapital nach [SCOPE.sCountry('target').GetName] verschieben"
 ism_move_subject_capital_effect_text: "Verschieben Sie das Kapital von [SCOPE.sCountry('target').GetName] in eine neue [location|e]."
 ism_move_subject_capital_effect_text_past: "Das Kapital von [SCOPE.sCountry('target').GetName] wurde in eine neue [location|e] verschoben."
 PROPOSE_ism_move_subject_capital: "Verschieben Sie das Kapital des Subjekts nach $TARGET$?\n$INFO$."

 # Change Subject Liturgical Language
 ism_change_subject_liturgical_language: "Liturgische Sprache ändern"
 ism_change_subject_liturgical_language_desc: "Wir werden verlangen, dass sie unsere [liturgical_language|e] übernehmen!"
 ism_change_subject_liturgical_language_act: "Änderung der liturgischen Sprache in [SCOPE.sCountry('recipient').GetName]"
 ism_change_subject_liturgical_language_effect_text: "[SCOPE.sCountry('actor').GetName] die [liturgical_language|e] in [SCOPE.sCountry('recipient').GetName] ändern"
 ism_change_subject_liturgical_language_effect_text_past: "[SCOPE.sCountry('actor').GetName] hat die [liturgical_language|e] in [SCOPE.sCountry('recipient').GetName] geändert."
 PROPOSE_ism_change_subject_liturgical_language: "Ändern Sie [liturgical_language|e] in $RECIPIENT$?\n$INFO$."

 # Block subject colonization
 ism_block_subject_colonization: "Block Kolonisierung"
 ism_block_subject_colonization_desc: "Wir werden verhindern, dass unser Subjekt neue [colonial_charters|e] erstellt."
 ism_block_subject_colonization_act: "Blockiert Kolonisierung"
 ism_block_subject_colonization_effect_text: "[SCOPE.sCountry('actor').GetName] blockiert die Kolonisierung von [SCOPE.sCountry('recipient').GetName]"
 ism_block_subject_colonization_effect_text_past: "[SCOPE.sCountry('actor').GetName] blockiert jetzt die Kolonisierung von [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_ism_block_subject_colonization: "Kolonisierung von $TARGET$ blockieren?"

 # Allow subject colonization
 allow_subject_colonization: "Kolonisierung zulassen"
 allow_subject_colonization_desc: "Wir werden unserem Subjekt erlauben, neue [colonial_charters|e] zu erstellen."
 allow_subject_colonization_act: "Erlaubt Kolonisierung"
 allow_subject_colonization_effect_text: "[SCOPE.sCountry('actor').GetName] ermöglicht die Kolonisierung von [SCOPE.sCountry('recipient').GetName]"
 allow_subject_colonization_effect_text_past: "[SCOPE.sCountry('actor').GetName] blockiert nicht mehr die Kolonisierung von [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_allow_subject_colonization: "Kolonisierung von $TARGET$ zulassen?"

 # Block subject urbanization
 ism_block_subject_urbanization: "Block Urbanisierung"
 ism_block_subject_urbanization_desc: "Wir werden unser Subjekt daran hindern, neue Städte zu gründen."
 ism_block_subject_urbanization_act: "Blöcke Urbanisierung"
 ism_block_subject_urbanization_effect_text: "[SCOPE.sCountry('actor').GetName] blockiert die Verstädterung von [SCOPE.sCountry('recipient').GetName]"
 ism_block_subject_urbanization_effect_text_past: "[SCOPE.sCountry('actor').GetName] blockiert jetzt die Urbanisierung von [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_ism_block_subject_urbanization: "Block Urbanisierung von $TARGET$?"

 # Allow subject urbanization
 allow_subject_urbanization: "Urbanisierung zulassen"
 allow_subject_urbanization_desc: "Wir werden unserem Subjekt erlauben, neue Städte zu gründen."
 allow_subject_urbanization_act: "Ermöglicht Urbanisierung"
 allow_subject_urbanization_effect_text: "[SCOPE.sCountry('actor').GetName] ermöglicht die Urbanisierung von [SCOPE.sCountry('recipient').GetName]"
 allow_subject_urbanization_effect_text_past: "[SCOPE.sCountry('actor').GetName] blockiert die Urbanisierung von [SCOPE.sCountry('recipient').GetName] nicht mehr."
 PROPOSE_allow_subject_urbanization: "Urbanisierung von $TARGET$ zulassen?"

 # Block subject declaring war
 ism_block_subject_declaring_war: "Block Kriegserklärung"
 ism_block_subject_declaring_war_desc: "Wir werden unsere Untertanen daran hindern, den Krieg zu erklären."
 ism_block_subject_declaring_war_act: "Blöcke erklären den Krieg"
 ism_block_subject_declaring_war_effect_text: "[SCOPE.sCountry('actor').GetName] verhindert, dass [SCOPE.sCountry('recipient').GetName] den Krieg erklärt"
 ism_block_subject_declaring_war_effect_text_past: "[SCOPE.sCountry('actor').GetName] verhindert jetzt, dass [SCOPE.sCountry('recipient').GetName] den Krieg erklärt"
 PROPOSE_ism_block_subject_declaring_war: "Blockieren Sie $TARGET$ für eine Kriegserklärung?"

 # Allow subject declaring war
 allow_subject_declaring_war: "Erlauben Sie eine Kriegserklärung"
 allow_subject_declaring_war_desc: "Wir werden unserem Untertan erlauben, den Krieg zu erklären."
 allow_subject_declaring_war_act: "Erlaubt eine Kriegserklärung"
 allow_subject_declaring_war_effect_text: "[SCOPE.sCountry('actor').GetName] erlaubt [SCOPE.sCountry('recipient').GetName], den Krieg zu erklären"
 allow_subject_declaring_war_effect_text_past: "[SCOPE.sCountry('actor').GetName] hindert [SCOPE.sCountry('recipient').GetName] nicht mehr daran, den Krieg zu erklären"
