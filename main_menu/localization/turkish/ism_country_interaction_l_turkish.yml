 PROPOSE_ism_transfer_land_to_subject: "Araziyi $RECIPIENT$?\n$INFO$'e aktarın."

 # Transfer Land from Subject
 ism_transfer_land_from_subject: "#E #!Arazi Transferi Nereden"
 ism_transfer_land_from_subject_desc: "Konumuzdan arazi transferi yapacağız."
