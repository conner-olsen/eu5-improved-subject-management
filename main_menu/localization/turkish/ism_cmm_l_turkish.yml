 ism_desc: "Uyruk yönetimini önemli ölçüde iyileştirmek için yeni etkileşimler, düzenlemeler ve otomasyonlar ekler."

 # QoL (qol) Tab
 ism__qol_name: "Yaşam Kalitesi"
 ## Automations (automations) Group
 ism__qol__automations_name: "Otomasyonlar"
 ism__auto_take_over_subject_wars_name: "Bağımlı Savaşlarına Otomatik Katıl"
 ism__auto_take_over_subject_wars_desc: "Etkinleştirildiğinde her yıl otomatik olarak tüm tebaa savaşlarına katılacak ve mümkünse bu savaşları devralacaksınız."
 ism__auto_subject_map_sharing_name: "Tabi Haritalarını Otomatik Paylaş"
 ism__auto_subject_map_sharing_desc: "Tabi devletinizin haritaları her yıl size yavaş yavaş yayılacak."
 ## Subject Rights (subject_rights) Group
 ism__qol__subject_rights_name: "Uyruk Hakları"
