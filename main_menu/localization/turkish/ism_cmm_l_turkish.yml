 ism__block_urbanization_name: "Şehirleşmeyi Engelle"
 ism__block_urbanization_desc: "Tüm tabiyetlerinizin kırsal mahalleri kasabaya yükseltmesini engeller."
 ism__block_columbian_exchange_name: "Kolomb Takasını Engelle"
 ism__block_columbian_exchange_desc: "Mevcut olduğunda tüm tabiyetlerinizin Kolomb Takası'nı kullanmasını engeller."
 ism__block_declaring_war_name: "Savaş İlan Etmeyi Engelle"
 ism__block_declaring_war_desc: "Tüm tebaalarınızın savaş ilan etmesini engeller."

