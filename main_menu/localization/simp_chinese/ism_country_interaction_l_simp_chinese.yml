 # Move Subject Capital
 ism_move_subject_capital: "#F #!移动资本"
 ism_move_subject_capital_desc: "我们将把主体的资本转移到新的 [location|e]。"
 ism_move_subject_capital_act: "将资本移至 [SCOPE.sCountry('target').GetName]］"
