l_simp_chinese:
 # Note to translators: The `#E #!` and `#F #!` prefixes are just used to order the interactions in the list.
 # Options
 select_country_to_transfer_land_from: "选择要转移土地的 [country|e]："
 select_country_to_transfer_land_to: "选择要转移土地的 [country|e]："
