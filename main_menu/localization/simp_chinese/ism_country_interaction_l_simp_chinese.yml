 ism_move_subject_capital_effect_text_past: "将 [SCOPE.sCountry('target').GetName] 资本移至新的 [location|e]。"
 PROPOSE_ism_move_subject_capital: "将主体的资本移至 $TARGET$?\n$INFO$。"

