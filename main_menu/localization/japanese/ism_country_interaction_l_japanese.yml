l_japanese:
 # Note to translators: The `#E #!` and `#F #!` prefixes are just used to order the interactions in the list.
 # Options
 select_country_to_transfer_land_from: "領土を没収する[country|e]を選択してください:"
 select_country_to_transfer_land_to: "領土を譲渡したい[country|e]を選択してください:"
 select_transfer_mode: "移譲モードを選択"

 # Generic Land Transfer
 transfer_location_from_subject_select_title: "従属国から移譲する場所を選択してください。"
 transfer_province_from_subject_select_title: "従属国から譲り受けるプロヴィンスを選択してください。"
 transfer_area_from_subject_select_title: "従属国から譲渡させるエリアを選択してください。"
 transfer_region_from_subject_select_title: "従属国から移管するリージョンを選択してください。"

 transfer_location_to_subject_select_title: "従属国に譲渡するロケーションを選択してください。"
 transfer_province_to_subject_select_title: "従属国に譲渡するプロバンスを選択してください。"
 transfer_area_to_subject_select_title: "従属国に譲渡するエリアを選択してください。"
 transfer_region_to_subject_select_title: "従属国へ譲渡するリージョンを選択してください。"

 select_a_location_to_move_capital: "従属国の首都を移転させる[location|e]をクリックして選択してください。"

 # Transfer Land to Subject
 ism_transfer_land_to_subject: "#E #!領土を譲渡"
 ism_transfer_land_to_subject_desc: "従属国に領土を譲渡します。"
 ism_transfer_land_to_subject_act: "[SCOPE.sCountry('recipient').GetName]に領土を与える"
 ism_transfer_land_to_subject_effect_text: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]に領土を譲渡します"
 ism_transfer_land_to_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]に領土を譲渡しました"
 PROPOSE_ism_transfer_land_to_subject: "$RECIPIENT$に領土を与えますか？\n$INFO$"

 # Transfer Land from Subject
 ism_transfer_land_from_subject: "#E #!領土の没収"
 ism_transfer_land_from_subject_desc: "従属国から領土を没収します。"
 ism_transfer_land_from_subject_act: "[SCOPE.sCountry('recipient').GetName]から領土を没収する"
 ism_transfer_land_from_subject_effect_text: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]から領土を奪います"
 ism_transfer_land_from_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]から領土を奪いました"
 PROPOSE_ism_transfer_land_from_subject: "$RECIPIENT$から領土を没収しますか？\n$INFO$"

 # Move Subject Capital
 ism_move_subject_capital: "#F #!首都の移転"
 ism_move_subject_capital_desc: "従属国の首都を新しい[location|e]へ移転させます。"
 ism_move_subject_capital_act: "首都を[SCOPE.sCountry('target').GetName]に移転"
 ism_move_subject_capital_effect_text: "[SCOPE.sCountry('target').GetName]の首都を新たな[location|e]へ移転します。"
 ism_move_subject_capital_effect_text_past: "[SCOPE.sCountry('target').GetName]の首都を新たな[location|e]へ移転させました。"
 PROPOSE_ism_move_subject_capital: "従属国の首都を$TARGET$へ移転しますか？\n$INFO$"

 # Change Subject Liturgical Language
 ism_change_subject_liturgical_language: "典礼言語の変更"
 ism_change_subject_liturgical_language_desc: "我が国の[liturgical_language|e]を採用するよう要求します！"
 ism_change_subject_liturgical_language_act: "[SCOPE.sCountry('recipient').GetName]の典礼言語の変更"
 ism_change_subject_liturgical_language_effect_text: "[SCOPE.sCountry('actor').GetName]が[SCOPE.sCountry('recipient').GetName]の[liturgical_language|e]を変更"
 ism_change_subject_liturgical_language_effect_text_past: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]の[liturgical_language|e]を変更しました"
 PROPOSE_ism_change_subject_liturgical_language: "$RECIPIENT$の[liturgical_language|e]を変更しますか？\n$INFO$"

 # Block subject colonization
 ism_block_subject_colonization: "植民の禁止"
 ism_block_subject_colonization_desc: "従属国が新たな[colonial_charters|e]を作成するのを禁止します。"
 ism_block_subject_colonization_act: "植民を禁止"
 ism_block_subject_colonization_effect_text: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]への入植を阻止しています"
 ism_block_subject_colonization_effect_text_past: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]への入植を阻止するようになりました"
 PROPOSE_ism_block_subject_colonization: "$TARGET$への入植を禁止しますか？"

 # Allow subject colonization

 # Block subject urbanization
 ism_block_subject_urbanization: "都市化の禁止"
 ism_block_subject_urbanization_desc: "従属国による新たな街の建設を禁止します。"
 ism_block_subject_urbanization_act: "都市化を阻止"
 ism_block_subject_urbanization_effect_text: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]の都市化を阻止しています"
 ism_block_subject_urbanization_effect_text_past: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]の都市化を阻止しています"
 PROPOSE_ism_block_subject_urbanization: "$TARGET$の都市化を禁止しますか？"

 # Allow subject urbanization

 # Block subject declaring war
 ism_block_subject_declaring_war: "宣戦布告を禁止"
 ism_block_subject_declaring_war_desc: "従属国による宣戦布告を禁止します。"
 ism_block_subject_declaring_war_act: "宣戦布告を禁止"
 ism_block_subject_declaring_war_effect_text: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]の宣戦布告を制限しています"
 ism_block_subject_declaring_war_effect_text_past: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]による宣戦布告を禁止しています"
