 ism_allow_columbian_exchange: "コロンブス交換から許可"
 ism_allow_columbian_exchange_desc: "従属国がコロンブス交換を利用することを許可します。"
 ism_allow_columbian_exchange_act: "コロンブス交換を可能にする"
 ism_allow_columbian_exchange_effect_text: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]がコロンブス交換を利用することを許可します。"
