 ism_allow_subject_urbanization: "都市化を許可"
 ism_allow_subject_urbanization_desc: "従属国が新たな町を創設することを許可します。"
 ism_allow_subject_urbanization_act: "都市化を許可"
 ism_allow_subject_urbanization_effect_text: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]の都市化を許可します"
 ism_allow_subject_urbanization_effect_text_past: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]の都市化を妨げるのをやめました。"
