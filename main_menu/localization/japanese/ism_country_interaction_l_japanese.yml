 PROPOSE_ism_allow_columbian_exchange: "$TARGET$にコロンブス交換の使用を許可しますか？"
 ism_take_subject_troops: "#D #!部隊の指揮権を掌握する"
 ism_take_subject_troops_desc: "共に戦争を戦っている間、従属国の軍隊の一つの指揮権を掌握します。軍の維持費は引き続き従属国が負担し、共通の戦争が終結するか、あるいは従属国の忠誠心が低下しすぎた場合に指揮権は返還されます。"
 ism_take_subject_troops_act: "[SCOPE.sCountry('recipient').GetName]から部隊の指揮権を掌握する"
 ism_take_subject_troops_effect_text: "[SCOPE.sCountry('actor').GetName]が[SCOPE.sCountry('recipient').GetName]の軍の指揮を執ります"
 ism_take_subject_troops_effect_text_past: "[SCOPE.sCountry('actor').GetName]が[SCOPE.sCountry('recipient').GetName]の軍の指揮を執りました"
 PROPOSE_ism_take_subject_troops: "$TARGET$の軍隊の1つの指揮を執りますか？"
 ism_take_subject_troops_choose_unit: "指揮を執る陸軍の選択"
 ism_take_subject_troops_no_units: "@trigger_no! 指揮権を引き継げる適切な軍隊がいません。"
 ism_take_subject_troops_select_unit: "指揮を執る[army|e]をクリックして選択してください。"
 ism_return_subject_troops: "#D #!部隊の返還"
 ism_return_subject_troops_desc: "従属国から接収したすべての軍隊の指揮権を返却します。"
 ism_return_subject_troops_act: "[SCOPE.sCountry('recipient').GetName]へ部隊を返還"
 ism_return_subject_troops_effect_text: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]に接収したすべての軍を返還します"
 ism_return_subject_troops_effect_text_past: "[SCOPE.sCountry('actor').GetName]は、徴用していたすべての軍を[SCOPE.sCountry('recipient').GetName]に返還しました"
