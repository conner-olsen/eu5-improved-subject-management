 ism_allow_subject_declaring_war: "宣戦布告を許可"
 ism_allow_subject_declaring_war_desc: "従属国が宣戦布告を行うことを許可します。"
 ism_allow_subject_declaring_war_act: "宣戦布告を許可"
 ism_allow_subject_declaring_war_effect_text: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]に宣戦布告を許可します"
 ism_allow_subject_declaring_war_effect_text_past: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]が宣戦布告することを禁止しなくなりました"
