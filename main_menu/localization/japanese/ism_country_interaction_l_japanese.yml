 ism_take_over_wars: "#B #!戦争の引き継ぎ"
 ism_take_over_wars_desc: "従属国が主導している全ての戦争を引き継ぎます。"
 ism_take_over_wars_act: "属国の戦争を引き継ぎます。"
 ism_take_over_wars_effect_text: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]のすべての戦争を引き継ぎます。"
 ism_take_over_wars_effect_text_past: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]のすべての戦争を引き継ぎました。"
