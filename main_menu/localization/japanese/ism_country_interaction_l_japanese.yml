l_japanese:
 # Note to translators: The `#E #!` and `#F #!` prefixes are just used to order the interactions in the list.
 # Options
 select_country_to_transfer_land_from: "土地を移転したい[country|e]を選択してください："
 select_country_to_transfer_land_to: "土地を移転したい[country|e]を選択してください："
 select_transfer_mode: "転送モードを選択"

 # Generic Land Transfer
 transfer_location_from_subject_select_title: "転送元となる場所を選択してください。"
 transfer_province_from_subject_select_title: "当校から転出する州を選択してください。"
 transfer_area_from_subject_select_title: "対象から転送する領域を選択してください。"
 transfer_region_from_subject_select_title: "対象から転送する地域を選択してください。"

 transfer_location_to_subject_select_title: "対象へ転送する場所を選択してください。"
 transfer_province_to_subject_select_title: "対象に譲渡する州を選択してください。"
 transfer_area_to_subject_select_title: "対象に貼り付ける領域を選択してください。"
 transfer_region_to_subject_select_title: "対象に送信する地域を選択してください。"

 select_a_location_to_move_capital: "クリックして、対象の首都を移転すべき[location|e]を選択してください。"

 # Transfer Land to Subject
 ism_transfer_land_to_subject: "#E #!土地を譲渡する"
 ism_transfer_land_to_subject_desc: "我々は臣下に土地を譲渡する。"
 ism_transfer_land_to_subject_act: "土地を[SCOPE.sCountry('recipient').GetName]に譲渡する"
 ism_transfer_land_to_subject_effect_text: "[SCOPE.sCountry('actor').GetName]は土地を[SCOPE.sCountry('recipient').GetName]に譲渡する"
 ism_transfer_land_to_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName] [SCOPE.sCountry('recipient').GetName] [SCOPE.sCountry('recipient').GetName] に土地を譲渡した"
 PROPOSE_ism_transfer_land_to_subject: "$RECIPIENT$を$RECIPIENT$に譲渡しますか？\n$INFO$"

 # Transfer Land from Subject
 ism_transfer_land_from_subject: "#E #!土地の譲渡元"
 ism_transfer_land_from_subject_desc: "我々は被支配者から土地を移転する。"
 ism_transfer_land_from_subject_act: "[SCOPE.sCountry('recipient').GetName]から土地を移転する"
 ism_transfer_land_from_subject_effect_text: "[SCOPE.sCountry('actor').GetName]は、[SCOPE.sCountry('recipient').GetName]から土地を移転する"
 ism_transfer_land_from_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName]が[SCOPE.sCountry('recipient').GetName]から土地を譲渡した"
 PROPOSE_ism_transfer_land_from_subject: "$RECIPIENT$から土地を移転しますか？\n$INFO$"

 # Move Subject Capital
 ism_move_subject_capital: "#F #!移動資本"
 ism_move_subject_capital_desc: "対象の資本を新たな[location|e]へ移転します。"
 ism_move_subject_capital_act: "資本を[SCOPE.sCountry('target').GetName]へ移動"
 ism_move_subject_capital_effect_text: "[SCOPE.sCountry('target').GetName]の首都を新しい[location|e]へ移転する。"
 ism_move_subject_capital_effect_text_past: "[SCOPE.sCountry('target').GetName]の首都を新たな[location|e]へ移転した。"
 PROPOSE_ism_move_subject_capital: "対象の$TARGET$を$TARGET$へ移動しますか？\n$INFO$"

 # Change Subject Liturgical Language
 ism_change_subject_liturgical_language: "典礼言語の変更"
 ism_change_subject_liturgical_language_desc: "我々は彼らに我々の[liturgical_language|e]を採用するよう要求する！"
 ism_change_subject_liturgical_language_act: "[SCOPE.sCountry('recipient').GetName]における典礼言語の変更"
 ism_change_subject_liturgical_language_effect_text: "[SCOPE.sCountry('actor').GetName] による [liturgical_language|e] の変更を [SCOPE.sCountry('recipient').GetName] で行ってください"
 ism_change_subject_liturgical_language_effect_text_past: "[SCOPE.sCountry('actor').GetName] [SCOPE.sCountry('recipient').GetName] の [liturgical_language|e] を変更しました"
 PROPOSE_ism_change_subject_liturgical_language: "$RECIPIENT$RECIPIENT$の[liturgical_language|e]を変更しますか？\n$INFO$"

 # Block subject colonization
 ism_block_subject_colonization: "ブロック植民地化"
 ism_block_subject_colonization_desc: "我々は対象が新たな[colonial_charters|e]を作成することを阻止する。"
 ism_block_subject_colonization_act: "植民地化を阻止する"
 ism_block_subject_colonization_effect_text: "[SCOPE.sCountry('actor').GetName]による[SCOPE.sCountry('recipient').GetName]の植民地化を阻止する"
 ism_block_subject_colonization_effect_text_past: "[SCOPE.sCountry('actor').GetName]による[SCOPE.sCountry('recipient').GetName]の植民地化が現在阻止されています"
 PROPOSE_ism_block_subject_colonization: "$TARGET$のブロック植民地化を阻止する？"

 # Allow subject colonization

 # Block subject urbanization
 ism_block_subject_urbanization: "都市化の阻止"
 ism_block_subject_urbanization_desc: "対象が新たな町を建設することを阻止します。"
 ism_block_subject_urbanization_act: "都市化を阻止する"
 ism_block_subject_urbanization_effect_text: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]の都市化を阻止する"
 ism_block_subject_urbanization_effect_text_past: "[SCOPE.sCountry('actor').GetName]が現在[SCOPE.sCountry('recipient').GetName]の都市化を妨げている"
 PROPOSE_ism_block_subject_urbanization: "$TARGET$TARGET$の都市化を阻止する？"

 # Allow subject urbanization

 # Block subject declaring war
 ism_block_subject_declaring_war: "ブロックによる宣戦布告"
 ism_block_subject_declaring_war_desc: "我々は対象が宣戦布告するのを阻止する。"
 ism_block_subject_declaring_war_act: "戦争を宣言するブロック"
 ism_block_subject_declaring_war_effect_text: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]が宣戦布告することを阻止する"
 ism_block_subject_declaring_war_effect_text_past: "[SCOPE.sCountry('actor').GetName] が [SCOPE.sCountry('recipient').GetName] の宣戦布告を阻止しています"
 PROPOSE_ism_block_subject_declaring_war: "$TARGET$宣戦布告するのを阻止する？"

 # Allow subject declaring war
 ism_allow_subject_colonization: "植民地化を許可する"
 ism_allow_subject_colonization_desc: "我々は対象が新たな[colonial_charters|e]を作成することを許可する。"
 ism_allow_subject_colonization_act: "植民地化を許可する"
 ism_allow_subject_colonization_effect_text: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]の植民地化を可能にする"
 ism_allow_subject_colonization_effect_text_past: "[SCOPE.sCountry('actor').GetName]による[SCOPE.sCountry('recipient').GetName]の植民地化は、もはや妨げられていません"
 PROPOSE_ism_allow_subject_colonization: "$TARGET$ARGET$の植民地化を許可しますか？"
 ism_allow_subject_urbanization: "都市化を許可する"
 ism_allow_subject_urbanization_desc: "我々は対象に新たな町を建設させることを許可する。"
 ism_allow_subject_urbanization_act: "都市化を可能にする"
 ism_allow_subject_urbanization_effect_text: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]の都市化を可能にする"
 ism_allow_subject_urbanization_effect_text_past: "[SCOPE.sCountry('actor').GetName]は、[SCOPE.sCountry('recipient').GetName]の都市化を妨げることはなくなりました"
 PROPOSE_ism_allow_subject_urbanization: "$TARGET$$の都市化を許可しますか？"
 ism_allow_subject_declaring_war: "宣戦布告を許可する"
 ism_allow_subject_declaring_war_desc: "我々は対象に宣戦を許す。"
 ism_allow_subject_declaring_war_act: "宣戦を許す"
 ism_allow_subject_declaring_war_effect_text: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]に宣戦布告を許可する"
 ism_allow_subject_declaring_war_effect_text_past: "[SCOPE.sCountry('actor').GetName] は、[SCOPE.sCountry('recipient').GetName] が宣戦布告することを妨げることはなくなりました"
 PROPOSE_ism_allow_subject_declaring_war: "$TARGET$宣戦を許可しますか？"
 ism_block_columbian_exchange: "コロンブス交換によるブロック"
 ism_block_columbian_exchange_desc: "我々は対象がコロンブス交換を利用することを阻止する。"
 ism_block_columbian_exchange_act: "コロンブス交換を阻止する"
 ism_block_columbian_exchange_effect_text: "コロンブス交換における[SCOPE.sCountry('actor').GetName]ブロックと[SCOPE.sCountry('recipient').GetName]"
 ism_block_columbian_exchange_effect_text_past: "[SCOPE.sCountry('actor').GetName] [SCOPE.sCountry('recipient').GetName] [SCOPE.sCountry('recipient').GetName] をコロンビア交換から遮断しています"
 PROPOSE_ism_block_columbian_exchange: "$TARGET$コロンビア交換を利用することをブロックする？"
 ism_ism_allow_columbian_exchange: "コロンブス交換から許可する"
 ism_ism_allow_columbian_exchange_desc: "対象がコロンブス交換を利用することを許可する。"
 ism_ism_allow_columbian_exchange_act: "コロンブス交換を可能にする"
 ism_ism_allow_columbian_exchange_effect_text: "[SCOPE.sCountry('actor').GetName]により、[SCOPE.sCountry('recipient').GetName]がコロンブス交換を利用可能となる"
 ism_ism_allow_columbian_exchange_effect_text_past: "[SCOPE.sCountry('actor').GetName] は、コロンブス交換における [SCOPE.sCountry('recipient').GetName] をブロックしなくなりました"
 PROPOSE_ism_ism_allow_columbian_exchange: "$TARGET$コロンブス交換を利用することを許可しますか？"
 ism_take_over_wars: "#B #!奪取戦争(たち)"
 ism_take_over_wars_desc: "我々は、我々の臣下が指導者である全ての戦争を引き継ぐ。"
 ism_take_over_wars_act: "主題戦争を引き継ぐ。"
 ism_take_over_wars_effect_text: "[SCOPE.sCountry('actor').GetName][SCOPE.sCountry('recipient').GetName]の全戦争を引き継ぐ"
 ism_take_over_wars_effect_text_past: "[SCOPE.sCountry('actor').GetName][SCOPE.sCountry('recipient').GetName]の全戦争を引き継いだ"
 PROPOSE_ism_take_over_wars: "$TARGET$全戦争を引き継ぐ？"
