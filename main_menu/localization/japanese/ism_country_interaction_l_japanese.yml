 # Allow subject declaring war
 ism_allow_subject_colonization: "植民を許可"
 ism_allow_subject_colonization_desc: "従属国が新しい[colonial_charters|e]を作成することを許可します。"
 ism_allow_subject_colonization_act: "植民を許可"
 ism_allow_subject_colonization_effect_text: "[SCOPE.sCountry('actor').GetName]は[SCOPE.sCountry('recipient').GetName]の入植を許可します"
