l_english:
 # Note to translators: The `#E #!` and `#F #!` prefixes are just used to order the interactions in the list.
 # Options
 select_country_to_transfer_land_from: "Select the [country|e] you want to transfer land from:"
 select_country_to_transfer_land_to: "Select the [country|e] you want to transfer land to:"
 select_transfer_mode: "Select Transfer Mode"

 # Generic Land Transfer
 transfer_location_from_subject_select_title: "Select a location to transfer from our subject."
 transfer_province_from_subject_select_title: "Select a province to transfer from our subject."
 transfer_area_from_subject_select_title: "Select an area to transfer from our subject."
 transfer_region_from_subject_select_title: "Select a region to transfer from our subject."

 transfer_location_to_subject_select_title: "Select a location to transfer to our subject."
 transfer_province_to_subject_select_title: "Select a province to transfer to our subject."
 transfer_area_to_subject_select_title: "Select an area to transfer to our subject."
 transfer_region_to_subject_select_title: "Select a region to transfer to our subject."

 select_a_location_to_move_capital: "Click to select a [location|e] that we should move our subject's capital to."

 # Transfer Land to Subject
 ism_transfer_land_to_subject: "#E #!Transfer Land To"
 ism_transfer_land_to_subject_desc: "We will transfer land to our subject."
 ism_transfer_land_to_subject_act: "Transfer Land to [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_to_subject_effect_text: "[SCOPE.sCountry('actor').GetName] will transfer land to [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_to_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName] transferred land to [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_transfer_land_to_subject: "Transfer land to $RECIPIENT$?\n$INFO$."

 # Transfer Land from Subject
 ism_transfer_land_from_subject: "#E #!Transfer Land From"
 ism_transfer_land_from_subject_desc: "We will transfer land from our subject."
 ism_transfer_land_from_subject_act: "Transfer Land from [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_from_subject_effect_text: "[SCOPE.sCountry('actor').GetName] will transfer land from [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_from_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName] transferred land from [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_transfer_land_from_subject: "Transfer land from $RECIPIENT$?\n$INFO$."

 # Move Subject Capital
 ism_move_subject_capital: "#F #!Move Capital"
 ism_move_subject_capital_desc: "We will move our subject's capital to a new [location|e]."
 ism_move_subject_capital_act: "Move Capital to [SCOPE.sCountry('target').GetName]"
 ism_move_subject_capital_effect_text: "Move [SCOPE.sCountry('target').GetName] capital to a new [location|e]."
 ism_move_subject_capital_effect_text_past: "Moved [SCOPE.sCountry('target').GetName] capital to a new [location|e]."
 PROPOSE_ism_move_subject_capital: "Move subject's capital to $TARGET$?\n$INFO$."

 # Change Subject Liturgical Language
 ism_change_subject_liturgical_language: "Change Liturgical Language"
 ism_change_subject_liturgical_language_desc: "We will demand that they adopt our [liturgical_language|e]!"
 ism_change_subject_liturgical_language_act: "Change Liturgical Language in [SCOPE.sCountry('recipient').GetName]"
 ism_change_subject_liturgical_language_effect_text: "[SCOPE.sCountry('actor').GetName] change the [liturgical_language|e] in [SCOPE.sCountry('recipient').GetName]"
 ism_change_subject_liturgical_language_effect_text_past: "[SCOPE.sCountry('actor').GetName] changed the [liturgical_language|e] in [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_change_subject_liturgical_language: "Change [liturgical_language|e] in $RECIPIENT$?\n$INFO$."

 # Block subject colonization
 ism_block_subject_colonization: "Block Colonization"
 ism_block_subject_colonization_desc: "We will prevent our subject from creating new [colonial_charters|e]."
 ism_block_subject_colonization_act: "Blocks Colonization"
 ism_block_subject_colonization_effect_text: "[SCOPE.sCountry('actor').GetName] blocks the colonization of [SCOPE.sCountry('recipient').GetName]"
 ism_block_subject_colonization_effect_text_past: "[SCOPE.sCountry('actor').GetName] is now blocking the colonization of [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_block_subject_colonization: "Block Colonization of $TARGET$?"

 # Allow subject colonization
 allow_subject_colonization: "Allow Colonization"
 allow_subject_colonization_desc: "We will allow our subject to create new [colonial_charters|e]."
 allow_subject_colonization_act: "Allows Colonization"
 allow_subject_colonization_effect_text: "[SCOPE.sCountry('actor').GetName] allows the colonization of [SCOPE.sCountry('recipient').GetName]"
 allow_subject_colonization_effect_text_past: "[SCOPE.sCountry('actor').GetName] is no longer blocking the colonization of [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_allow_subject_colonization: "Allow Colonization of $TARGET$?"

 # Block subject urbanization
 ism_block_subject_urbanization: "Block Urbanization"
 ism_block_subject_urbanization_desc: "We will prevent our subject from creating new towns."
 ism_block_subject_urbanization_act: "Blocks Urbanization"
 ism_block_subject_urbanization_effect_text: "[SCOPE.sCountry('actor').GetName] blocks the urbanization of [SCOPE.sCountry('recipient').GetName]"
 ism_block_subject_urbanization_effect_text_past: "[SCOPE.sCountry('actor').GetName] is now blocking the urbanization of [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_block_subject_urbanization: "Block Urbanization of $TARGET$?"

 # Allow subject urbanization
 allow_subject_urbanization: "Allow Urbanization"
 allow_subject_urbanization_desc: "We will allow our subject to create new towns."
 allow_subject_urbanization_act: "Allows Urbanization"
 allow_subject_urbanization_effect_text: "[SCOPE.sCountry('actor').GetName] allows the urbanization of [SCOPE.sCountry('recipient').GetName]"
 allow_subject_urbanization_effect_text_past: "[SCOPE.sCountry('actor').GetName] is no longer blocking the urbanization of [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_allow_subject_urbanization: "Allow Urbanization of $TARGET$?"

 # Block subject declaring war
 ism_block_subject_declaring_war: "Block Declaring War"
 ism_block_subject_declaring_war_desc: "We will prevent our subject from declaring war."
 ism_block_subject_declaring_war_act: "Blocks Declaring War"
 ism_block_subject_declaring_war_effect_text: "[SCOPE.sCountry('actor').GetName] blocks [SCOPE.sCountry('recipient').GetName] from declaring war"
 ism_block_subject_declaring_war_effect_text_past: "[SCOPE.sCountry('actor').GetName] is now blocking [SCOPE.sCountry('recipient').GetName] from declaring war"
 PROPOSE_ism_block_subject_declaring_war: "Block $TARGET$ from declaring war?"

 # Allow subject declaring war
 allow_subject_declaring_war: "Allow Declaring War"
 allow_subject_declaring_war_desc: "We will allow our subject to declare war."
 allow_subject_declaring_war_act: "Allows Declaring War"
 allow_subject_declaring_war_effect_text: "[SCOPE.sCountry('actor').GetName] allows [SCOPE.sCountry('recipient').GetName] to declare war"
 allow_subject_declaring_war_effect_text_past: "[SCOPE.sCountry('actor').GetName] is no longer blocking [SCOPE.sCountry('recipient').GetName] from declaring war"
 PROPOSE_allow_subject_declaring_war: "Allow $TARGET$ to declare war?"

 # Take over all wars
 ism_take_over_war: "#B #!Take Over War(s)"
 ism_take_over_war_desc: "We will take over all wars our subject is the leader of."
 ism_take_over_war_act: "Takes over subject wars."
 ism_take_over_war_effect_text: "[SCOPE.sCountry('actor').GetName] takes over all the wars of [SCOPE.sCountry('recipient').GetName]"
 ism_take_over_war_effect_text_past: "[SCOPE.sCountry('actor').GetName] has taken over all the wars of [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_take_over_war: "Take over all of $TARGET$'s wars?"
