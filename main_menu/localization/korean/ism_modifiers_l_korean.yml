l_korean:
 # Block colonization




 STATIC_MODIFIER_NAME_ism_overlord_blocking_colonization: "종주국에 의해 식민화가 차단됨"
 STATIC_MODIFIER_DESC_ism_overlord_blocking_colonization: "이 식민지 국가는 [overlord|e]에 의해 새로운 [colonial_charters|e] 생성이 차단되었습니다."
 STATIC_MODIFIER_NAME_ism_forced_us_to_use_their_liturgical_language: "전례 언어 변경 차단됨"
 STATIC_MODIFIER_DESC_ism_forced_us_to_use_their_liturgical_language: "이 국가는 [overlord|e]에 의해 [liturgical_language|e]을(를) 변경하도록 강요받았습니다."
 STATIC_MODIFIER_NAME_ism_overlord_blocking_urbanization: "종주국에 의해 차단된 도시화"
 STATIC_MODIFIER_DESC_ism_overlord_blocking_urbanization: "이 국가는 [overlord|e]에 의해 새로운 도시 건설이 금지되었습니다."
 STATIC_MODIFIER_NAME_ism_overlord_blocking_war_declarations: "종주국에 의해 전쟁 선포가 차단됨"
 STATIC_MODIFIER_DESC_ism_overlord_blocking_war_declarations: "이 국가는 [overlord|e]에 의해 전쟁 선포가 금지되었습니다."
 MODIFIER_TYPE_NAME_ism_blocked_from_columbian_exchange: "콜럼버스 교환에서 차단됨"
 MODIFIER_TYPE_DESC_ism_blocked_from_columbian_exchange: "이 국가는 [columbian_exchange|e] 참여가 차단되었습니다."
 STATIC_MODIFIER_NAME_ism_overlord_blocking_columbian_exchange: "종주국에 의해 콜럼버스 교환이 차단됨"
 STATIC_MODIFIER_DESC_ism_overlord_blocking_columbian_exchange: "이 국가는 [overlord|e]에 의해 [columbian_exchange|e] 참여가 금지되었습니다."
 MODIFIER_TYPE_NAME_ism_blocked_from_colonization: "종주국의 식민지 개척 차단"
 MODIFIER_TYPE_DESC_ism_blocked_from_colonization: "종주국이 이 국가의 새로운 [colonial_charters|e] 생성을 금지합니다."
 STATIC_MODIFIER_NAME_ism_overlord_blocking_all_subject_war_declarations: "종주국의 종속국 전쟁 선포 차단"
 STATIC_MODIFIER_DESC_ism_overlord_blocking_all_subject_war_declarations: "종주국은 종속국이 전쟁을 시작하는 것을 허용하지 않습니다."
 STATIC_MODIFIER_NAME_ism_overlord_blocking_all_subject_colonization: "주권국의 종속국 개척 차단"
 STATIC_MODIFIER_DESC_ism_overlord_blocking_all_subject_colonization: "종주국은 속국이 새로운 [colonial_charters|e]을(를) 생성하는 것을 허용하지 않습니다."
 STATIC_MODIFIER_NAME_ism_overlord_blocking_all_subject_urbanization: "종주국의 종속국 도시화 저지"
 STATIC_MODIFIER_DESC_ism_overlord_blocking_all_subject_urbanization: "종주국은 종속국이 새로운 도시를 건설하는 것을 허가하지 않습니다."
 STATIC_MODIFIER_NAME_ism_overlord_blocking_all_subject_columbian_exchange: "종주국의 종속국 콜럼버스 교환 차단"
 STATIC_MODIFIER_DESC_ism_overlord_blocking_all_subject_columbian_exchange: "종주국은 종속국이 [columbian_exchange|e]에 참여하는 것을 허용하지 않습니다."
 STATIC_MODIFIER_NAME_ism_taken_from_subject: "종속국에서 가져옴"
 STATIC_MODIFIER_DESC_ism_taken_from_subject: "이 군대는 종속국으로부터 차출되었으며, 공동의 전쟁이 종료되거나 종속국의 충성도가 너무 낮아지면 해당 종속국에 반환됩니다."
