 PROPOSE_ism_transfer_land_to_subject: "땅을 $RECIPIENT$?\n$INFO$로 이동합니다."

 # Transfer Land from Subject
 ism_transfer_land_from_subject: "#E #!다음에서 토지 이전"
 ism_transfer_land_from_subject_desc: "피사체에서 토지를 이전합니다."
