l_korean:
 # Note to translators: The `#E #!` and `#F #!` prefixes are just used to order the interactions in the list.
 # Options
 select_country_to_transfer_land_from: "토지를 이전할 [country|e]를 선택하세요:"
 select_country_to_transfer_land_to: "토지를 이전할 [country|e]를 선택하세요:"
 select_transfer_mode: "전송 모드 선택"

 # Generic Land Transfer
 transfer_location_from_subject_select_title: "주제에서 전송할 위치를 선택하십시오."
 transfer_province_from_subject_select_title: "해당 주에서 이전할 주를 선택하십시오."
 transfer_area_from_subject_select_title: "주제에서 전송할 영역을 선택하십시오."
 transfer_region_from_subject_select_title: "해당 주제에서 전송할 지역을 선택하십시오."

 transfer_location_to_subject_select_title: "대상에게 전송할 위치를 선택하십시오."
 transfer_province_to_subject_select_title: "해당 과목으로 이수할 주를 선택하세요."
 transfer_area_to_subject_select_title: "대상으로 전송할 영역을 선택하십시오."
 transfer_region_to_subject_select_title: "해당 주제를 전송할 지역을 선택하십시오."

 select_a_location_to_move_capital: "[location|e]를 클릭하여 대상의 수도를 이전할 위치를 선택하세요."

 # Transfer Land to Subject
 ism_transfer_land_to_subject: "#E #!토지 이전"
 ism_transfer_land_to_subject_desc: "우리는 신하에게 토지를 양도할 것이다."
 ism_transfer_land_to_subject_act: "토지를 [SCOPE.sCountry('recipient').GetName]에게 이전하십시오"
 ism_transfer_land_to_subject_effect_text: "[SCOPE.sCountry('actor').GetName]은 토지를 [SCOPE.sCountry('recipient').GetName]에게 이전합니다."
 ism_transfer_land_to_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName][SCOPE.sCountry('recipient').GetName]에게 토지를 양도했습니다."
 PROPOSE_ism_transfer_land_to_subject: "토지를 $RECIPIENT$에게 양도할까요?\n$INFO$."

 # Transfer Land from Subject
 ism_transfer_land_from_subject: "#E #!토지 이전"
 ism_transfer_land_from_subject_desc: "우리는 피지배민으로부터 토지를 이전할 것입니다."
 ism_transfer_land_from_subject_act: "[SCOPE.sCountry('recipient').GetName]로부터 토지를 이전하십시오"
 ism_transfer_land_from_subject_effect_text: "[SCOPE.sCountry('actor').GetName] [SCOPE.sCountry('recipient').GetName]으로부터 토지를 이전할 것입니다."
 ism_transfer_land_from_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName]이(가[SCOPE.sCountry('recipient').GetName]에게 토지를 양도했습니다."
 PROPOSE_ism_transfer_land_from_subject: "$RECIPIENT$?\n$INFO$로부터 토지를 이전합니까$INFO$"

 # Move Subject Capital
 ism_move_subject_capital: "#F #!이동 자본"
 ism_move_subject_capital_desc: "우리는 대상의 자본을 새로운 [location|e]로 이전할 것입니다."
 ism_move_subject_capital_act: "자본을 [SCOPE.sCountry('target').GetName]으로 이전하십시오"
 ism_move_subject_capital_effect_text: "[SCOPE.sCountry('target').GetName]의 수도를 새로운 [location|e]로 이전하십시오."
 ism_move_subject_capital_effect_text_past: "[SCOPE.sCountry('target').GetName]의 수도를 새로운 [location|e]로 이전했습니다."
 PROPOSE_ism_move_subject_capital: "주체의 자본을 $TARGET$TARGET$로 이동할까요?\n$INFO$."

 # Change Subject Liturgical Language
 ism_change_subject_liturgical_language: "전례 언어 변경"
 ism_change_subject_liturgical_language_desc: "우리는 그들이 우리의 [liturgical_language|e]를 채택하도록 요구할 것이다!"
 ism_change_subject_liturgical_language_act: "[SCOPE.sCountry('recipient').GetName]의 전례 언어 변경"
 ism_change_subject_liturgical_language_effect_text: "[SCOPE.sCountry('actor').GetName]의 [liturgical_language|e]를 [SCOPE.sCountry('recipient').GetName]에서 변경하십시오."
 ism_change_subject_liturgical_language_effect_text_past: "[SCOPE.sCountry('actor').GetName][SCOPE.sCountry('recipient').GetName]가) [SCOPE.sCountry('recipient').GetName]의 [liturgical_language|e]를 변경했습니다."
 PROPOSE_ism_change_subject_liturgical_language: "$RECIPIENT$에서 [liturgical_language|e]로 변경하시겠습니까?\n$INFO$."

 # Block subject colonization
 ism_block_subject_colonization: "블록 식민지화"
 ism_block_subject_colonization_desc: "우리는 대상이 새로운 [colonial_charters|e] 생성하는 것을 막을 것입니다."
 ism_block_subject_colonization_act: "식민지화 차단"
 ism_block_subject_colonization_effect_text: "[SCOPE.sCountry('actor').GetName][SCOPE.sCountry('recipient').GetName]의 식민지화를 차단합니다."
 ism_block_subject_colonization_effect_text_past: "[SCOPE.sCountry('actor').GetName][SCOPE.sCountry('recipient').GetName](가) 현재 [SCOPE.sCountry('recipient').GetName]의 식민지화를 차단하고 있습니다."
 PROPOSE_ism_block_subject_colonization: "$TARGET$의 블록 식민지화를 $TARGET$?"

 # Allow subject colonization
 allow_subject_colonization: "식민지화를 허용하다"
 allow_subject_colonization_desc: "우리는 대상이 새로운 [colonial_charters|e]을 작성하도록 허용할 것입니다."
 allow_subject_colonization_act: "식민지화를 허용합니다"
 allow_subject_colonization_effect_text: "[SCOPE.sCountry('actor').GetName][SCOPE.sCountry('recipient').GetName] [SCOPE.sCountry('recipient').GetName]의 식민지화를 허용합니다."
 allow_subject_colonization_effect_text_past: "[SCOPE.sCountry('actor').GetName]이 더 이상 [SCOPE.sCountry('recipient').GetName]의 식민지화를 차단하지 않습니다."
 PROPOSE_allow_subject_colonization: "$TARGET$TARGET$의 식민지화를 허용하시겠습니까?"

 # Block subject urbanization
 ism_block_subject_urbanization: "도시화 차단"
 ism_block_subject_urbanization_desc: "우리는 대상이 새로운 마을을 생성하는 것을 막을 것입니다."
 ism_block_subject_urbanization_act: "도시화를 차단하다"
 ism_block_subject_urbanization_effect_text: "[SCOPE.sCountry('actor').GetName][SCOPE.sCountry('recipient').GetName]의 도시화를 차단합니다."
 ism_block_subject_urbanization_effect_text_past: "[SCOPE.sCountry('actor').GetName]이(가) 현재 [SCOPE.sCountry('recipient').GetName]의 도시화를 저지하고 있습니다."
 PROPOSE_ism_block_subject_urbanization: "$TARGET$TARGET$의 도시화를 차단할까요?"

 # Allow subject urbanization
 allow_subject_urbanization: "도시화를 허용하다"
 allow_subject_urbanization_desc: "우리는 피험자가 새로운 마을을 만들도록 허용할 것입니다."
 allow_subject_urbanization_act: "도시화를 허용한다"
 allow_subject_urbanization_effect_text: "[SCOPE.sCountry('actor').GetName][SCOPE.sCountry('recipient').GetName] [SCOPE.sCountry('recipient').GetName]의 도시화를 가능하게 합니다."
 allow_subject_urbanization_effect_text_past: "[SCOPE.sCountry('actor').GetName]는 더 이상 [SCOPE.sCountry('recipient').GetName]의 도시화를 방해하지 않습니다."
 PROPOSE_allow_subject_urbanization: "$TARGET$TARGET$의 도시화를 허용할까요?"

 # Block subject declaring war
 ism_block_subject_declaring_war: "전쟁 선포"
 ism_block_subject_declaring_war_desc: "우리는 대상이 전쟁을 선포하는 것을 막을 것이다."
 ism_block_subject_declaring_war_act: "전쟁 선포 블록"
