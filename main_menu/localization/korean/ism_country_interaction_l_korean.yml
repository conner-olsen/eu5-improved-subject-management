 # Transfer Land to Subject
 ism_transfer_land_to_subject: "#E #!영토 하사"
 ism_transfer_land_to_subject_desc: "우리는 종속국에게 영토를 양도할 것입니다."
 ism_transfer_land_to_subject_act: "[SCOPE.sCountry('recipient').GetName]에게 영토 하사"
 ism_transfer_land_to_subject_effect_text: "[SCOPE.sCountry('actor').GetName]이(가) [SCOPE.sCountry('recipient').GetName]에게 영토를 양도할 것입니다."
 ism_transfer_land_to_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName]이(가) [SCOPE.sCountry('recipient').GetName]에게 영토를 양도했습니다."
 PROPOSE_ism_transfer_land_to_subject: "$RECIPIENT$에게 영토를 주겠습니까?\n$INFO$"

 # Transfer Land from Subject
 ism_transfer_land_from_subject: "#E #!영토 몰수"
 ism_transfer_land_from_subject_desc: "우리는 종속국으로부터 영토를 가져올 것입니다."
