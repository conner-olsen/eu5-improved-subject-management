l_korean:
 # Note to translators: The `#E #!` and `#F #!` prefixes are just used to order the interactions in the list.
 # Options
 select_country_to_transfer_land_from: "영토를 몰수할 [country|e]을(를) 선택하십시오:"
 select_country_to_transfer_land_to: "영토를 하사할 [country|e]을(를) 선택하십시오:"
