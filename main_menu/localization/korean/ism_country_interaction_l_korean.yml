 ism_block_subject_declaring_war_effect_text_past: "[SCOPE.sCountry('actor').GetName]이(가) [SCOPE.sCountry('recipient').GetName]의 선전포고를 차단하고 있습니다."
 PROPOSE_ism_block_subject_declaring_war: "$TARGET$ 전쟁을 선포하는 것을 차단할까요?"

 # Allow subject declaring war
 allow_subject_declaring_war: "선전포고 허용"
