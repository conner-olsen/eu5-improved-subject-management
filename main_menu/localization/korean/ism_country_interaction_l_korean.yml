 # Generic Land Transfer
 transfer_location_from_subject_select_title: "종속국으로부터 이전받을 위치를 선택하십시오."
 transfer_province_from_subject_select_title: "종속국으로부터 양도받을 프로방스를 선택하십시오."
 transfer_area_from_subject_select_title: "종속국으로부터 이전할 지역을 선택하십시오."
 transfer_region_from_subject_select_title: "종속국으로부터 이전받을 지역을 선택하십시오."

 transfer_location_to_subject_select_title: "우리 종속국에게 양도할 지역을 선택하십시오."
 transfer_province_to_subject_select_title: "종속국에게 양도할 프로방스를 선택하십시오."
