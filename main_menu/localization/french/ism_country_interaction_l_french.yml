 ism_take_subject_troops: "#D #!Prendre le commandement des troupes"
 ism_take_subject_troops_desc: "Nous prendrons le commandement de l'une des armées de notre sujet tant que nous combattrons ensemble dans une guerre. Notre sujet continuera d'en payer l'entretien, et le commandement lui sera rendu à la fin de la guerre commune ou si sa loyauté devient trop faible."
 ism_take_subject_troops_act: "Prendre le commandement des troupes de [SCOPE.sCountry('recipient').GetName]"
