l_french:
 # Note to translators: The `#E #!` and `#F #!` prefixes are just used to order the interactions in the list.
 # Options
 select_country_to_transfer_land_from: "Sélectionnez le [country|e] auquel vous souhaitez prendre des terres :"
 select_country_to_transfer_land_to: "Sélectionnez le [country|e] auquel vous voulez donner des terres :"
 select_transfer_mode: "Sélectionner le mode de transfert"

 # Generic Land Transfer
 transfer_location_from_subject_select_title: "Sélectionnez un lieu à transférer de notre sujet."
 transfer_province_from_subject_select_title: "Sélectionnez une province à transférer depuis notre sujet."
 transfer_area_from_subject_select_title: "Sélectionnez une zone à transférer de notre sujet."
 transfer_region_from_subject_select_title: "Sélectionnez une région à transférer de notre sujet."

 transfer_location_to_subject_select_title: "Sélectionnez une localisation à transférer à notre sujet."
 transfer_province_to_subject_select_title: "Sélectionnez une province à transférer à notre sujet."
 transfer_area_to_subject_select_title: "Sélectionnez une zone à transférer à notre sujet."
 transfer_region_to_subject_select_title: "Sélectionner une région à transférer à notre sujet."

 select_a_location_to_move_capital: "Cliquez pour sélectionner une [location|e] vers laquelle déplacer la capitale de notre sujet."

 # Transfer Land to Subject
 ism_transfer_land_to_subject: "#E #!Donner des terres"
 ism_transfer_land_to_subject_desc: "Nous céderons des terres à notre sujet."
 ism_transfer_land_to_subject_act: "Donner des terres à [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_to_subject_effect_text: "[SCOPE.sCountry('actor').GetName] cédera des terres à [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_to_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName] a cédé des terres à [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_transfer_land_to_subject: "Donner des terres à $RECIPIENT$ ?\n$INFO$"

 # Transfer Land from Subject
 ism_transfer_land_from_subject: "#E #!Prendre des terres"
 ism_transfer_land_from_subject_desc: "Nous saisirons des terres à notre sujet."
 ism_transfer_land_from_subject_act: "Prendre des terres à [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_from_subject_effect_text: "[SCOPE.sCountry('actor').GetName] prendra des terres à [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_from_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName] a pris des terres à [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_transfer_land_from_subject: "Prendre des terres à $RECIPIENT$ ?\n$INFO$"

 # Move Subject Capital
 ism_move_subject_capital: "#F #!Déplacer la capitale"
 ism_move_subject_capital_desc: "Nous déplacerons la capitale de notre sujet vers un nouveau [location|e]."
 ism_move_subject_capital_act: "Déplacer la capitale vers [SCOPE.sCountry('target').GetName]"
 ism_move_subject_capital_effect_text: "Déplacer la capitale de [SCOPE.sCountry('target').GetName] vers un nouveau [location|e]."
 ism_move_subject_capital_effect_text_past: "A déplacé la capitale de [SCOPE.sCountry('target').GetName] vers un nouveau [location|e]."
 PROPOSE_ism_move_subject_capital: "Déplacer la capitale du sujet vers $TARGET$ ?\n$INFO$"

 # Change Subject Liturgical Language
 ism_change_subject_liturgical_language: "Changer la langue liturgique"
 ism_change_subject_liturgical_language_desc: "Nous exigerons qu'ils adoptent notre [liturgical_language|e] !"
 ism_change_subject_liturgical_language_act: "Changer la langue liturgique en [SCOPE.sCountry('recipient').GetName]"
 ism_change_subject_liturgical_language_effect_text: "[SCOPE.sCountry('actor').GetName] change [liturgical_language|e] dans [SCOPE.sCountry('recipient').GetName]"
 ism_change_subject_liturgical_language_effect_text_past: "[SCOPE.sCountry('actor').GetName] a modifié [liturgical_language|e] dans [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_change_subject_liturgical_language: "Modifier [liturgical_language|e] en $RECIPIENT$ ?\n$INFO$"

 # Block subject colonization
 ism_block_subject_colonization: "Interdire la colonisation"
 ism_block_subject_colonization_desc: "Nous empêcherons notre sujet de créer de nouveaux [colonial_charters|e]."
 ism_block_subject_colonization_act: "Empêche la colonisation"
 ism_block_subject_colonization_effect_text: "[SCOPE.sCountry('actor').GetName] bloque la colonisation de [SCOPE.sCountry('recipient').GetName]"
 ism_block_subject_colonization_effect_text_past: "[SCOPE.sCountry('actor').GetName] bloque désormais la colonisation de [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_block_subject_colonization: "Bloquer la colonisation de $TARGET$ ?"

