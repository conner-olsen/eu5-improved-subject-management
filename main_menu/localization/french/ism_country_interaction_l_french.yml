l_french:
 # Note to translators: The `#E #!` and `#F #!` prefixes are just used to order the interactions in the list.
 # Options
 select_country_to_transfer_land_from: "Sélectionnez le [country|e] dont vous souhaitez transférer des terres :"
 select_country_to_transfer_land_to: "Sélectionnez le [country|e] vers lequel vous souhaitez transférer des terres :"
 select_transfer_mode: "Sélectionner le mode de transfert"

 # Generic Land Transfer
 transfer_location_from_subject_select_title: "Sélectionnez un emplacement à partir duquel effectuer le transfert à partir de notre sujet."
 transfer_province_from_subject_select_title: "Sélectionnez une province pour transférer depuis notre sujet."
 transfer_area_from_subject_select_title: "Sélectionnez une zone à transférer à partir de notre sujet."
 transfer_region_from_subject_select_title: "Sélectionnez une région à transférer à partir de notre sujet."

 transfer_location_to_subject_select_title: "Sélectionnez un emplacement vers lequel transférer notre sujet."
 transfer_province_to_subject_select_title: "Sélectionnez une province pour transférer notre sujet."
 transfer_area_to_subject_select_title: "Sélectionnez une zone à transférer vers notre sujet."
 transfer_region_to_subject_select_title: "Sélectionnez une région à transférer vers notre sujet."

 select_a_location_to_move_capital: "Cliquez pour sélectionner un [location|e] où nous devrions déplacer la capitale de notre sujet."

 # Transfer Land to Subject
 ism_transfer_land_to_subject: "#E #!Transférer le terrain à"
 ism_transfer_land_to_subject_desc: "Nous transférerons des terres à notre sujet."
 ism_transfer_land_to_subject_act: "Transférer le terrain à [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_to_subject_effect_text: "[SCOPE.sCountry('actor').GetName] transférera des terres à [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_to_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName] a transféré des terres à [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_transfer_land_to_subject: "Transférer le terrain à $RECIPIENT$ ? \n$INFO$."

 # Transfer Land from Subject
 ism_transfer_land_from_subject: "#E #!Transfert de terrain depuis"
 ism_transfer_land_from_subject_desc: "Nous transférerons les terres de notre sujet."
 ism_transfer_land_from_subject_act: "Transférer des terres depuis [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_from_subject_effect_text: "[SCOPE.sCountry('actor').GetName] transférera des terres à [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_from_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName] a transféré des terres à [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_transfer_land_from_subject: "Transférer le terrain de $RECIPIENT$?\n$INFO$."

 # Move Subject Capital
 ism_move_subject_capital: "#F #!Move Capital"
 ism_move_subject_capital_desc: "Nous transférerons le capital de notre sujet vers un nouvel [location|e]."
 ism_move_subject_capital_act: "Déplacer le capital vers [SCOPE.sCountry('target').GetName]"
 ism_move_subject_capital_effect_text: "Déplacer la capitale [SCOPE.sCountry('target').GetName] vers un nouvel emplacement [location|e]."
 ism_move_subject_capital_effect_text_past: "Déplacement de la capitale [SCOPE.sCountry('target').GetName] vers un nouvel emplacement [location|e]."
 PROPOSE_ism_move_subject_capital: "Déplacer le capital du sujet vers $TARGET$?\n$INFO$."

 # Change Subject Liturgical Language
 ism_change_subject_liturgical_language: "Changer le langage liturgique"
 ism_change_subject_liturgical_language_desc: "Nous exigerons qu'ils adoptent notre [liturgical_language|e] !"
 ism_change_subject_liturgical_language_act: "Modifier le langage liturgique dans [SCOPE.sCountry('recipient').GetName]"
 ism_change_subject_liturgical_language_effect_text: "[SCOPE.sCountry('actor').GetName] modifier la [liturgical_language|e] dans [SCOPE.sCountry('recipient').GetName]"
 ism_change_subject_liturgical_language_effect_text_past: "[SCOPE.sCountry('actor').GetName] a modifié la [liturgical_language|e] dans [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_change_subject_liturgical_language: "Modifier [liturgical_language|e] dans $RECIPIENT$?\n$INFO$."

 # Block subject colonization
 ism_block_subject_colonization: "Blocage de la colonisation"
