 ism_block_subject_colonization_effect_text_past: "[SCOPE.sCountry('actor').GetName] bloque désormais la colonisation de [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_block_subject_colonization: "Bloquer la colonisation de $TARGET$ ?"

