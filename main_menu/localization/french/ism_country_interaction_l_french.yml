l_french:
 # Note to translators: The `#E #!` and `#F #!` prefixes are just used to order the interactions in the list.
 # Options
 select_country_to_transfer_land_from: "Sélectionnez le [country|e] à partir duquel vous souhaitez transférer des terres :"
 select_country_to_transfer_land_to: "Sélectionnez le [country|e] vers lequel vous souhaitez transférer des terres :"
 select_transfer_mode: "Sélection du mode de transfert"

 # Generic Land Transfer
 transfer_location_from_subject_select_title: "Sélectionnez un lieu à transférer à partir de notre sujet."
 transfer_province_from_subject_select_title: "Sélectionnez une province à transférer à partir de notre sujet."
 transfer_area_from_subject_select_title: "Sélectionnez un domaine à transférer à partir de notre sujet."
 transfer_region_from_subject_select_title: "Sélectionnez une région à transférer à partir de notre sujet."

 transfer_location_to_subject_select_title: "Sélectionnez un lieu à transférer vers notre sujet."
 transfer_province_to_subject_select_title: "Sélectionnez une province à transférer vers notre sujet."
 transfer_area_to_subject_select_title: "Sélectionnez un domaine à transférer vers notre sujet."
 transfer_region_to_subject_select_title: "Sélectionnez une région à transférer vers notre sujet."

 select_a_location_to_move_capital: "Cliquez pour sélectionner une [location|e] vers laquelle nous devons déplacer le capital de notre sujet."

 # Transfer Land to Subject
 ism_transfer_land_to_subject: "#E #!Transférer la terre à"
 ism_transfer_land_to_subject_desc: "Nous transférerons des terres à notre sujet."
 ism_transfer_land_to_subject_act: "Transférer les terres à [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_to_subject_effect_text: "[SCOPE.sCountry('actor').GetName] transfère des terres à [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_to_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName] a transféré des terres à [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_transfer_land_to_subject: "Transférer la terre à $RECIPIENT$?\N$INFO$."

 # Transfer Land from Subject
 ism_transfer_land_from_subject: "#E #!Transfert de terres de"
 ism_transfer_land_from_subject_desc: "Nous allons transférer des terres de notre sujet."
 ism_transfer_land_from_subject_act: "Transfert de terres de [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_from_subject_effect_text: "[SCOPE.sCountry('actor').GetName] transférera des terres de [SCOPE.sCountry('recipient').GetName]"
 ism_transfer_land_from_subject_effect_text_past: "[SCOPE.sCountry('actor').GetName] terres transférées de [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_transfer_land_from_subject: "Transférer les terres de $RECIPIENT$ à $INFO$."

 # Move Subject Capital
 ism_move_subject_capital: "#F #!Déplacer le capital"
 ism_move_subject_capital_desc: "Nous allons déplacer le capital de notre sujet vers un nouveau [location|e]."
 ism_move_subject_capital_act: "Déplacer le capital vers [SCOPE.sCountry('target').GetName]"
 ism_move_subject_capital_effect_text: "Déplacer le capital [SCOPE.sCountry('target').GetName] vers un nouveau [location|e]."
 ism_move_subject_capital_effect_text_past: "Déplacement du capital [SCOPE.sCountry('target').GetName] vers un nouveau [location|e]."
 PROPOSE_ism_move_subject_capital: "Déplacer le capital du sujet vers $TARGET$?\N$INFO$."

 # Change Subject Liturgical Language
 ism_change_subject_liturgical_language: "Changer la langue liturgique"
 ism_change_subject_liturgical_language_desc: "Nous exigerons qu'ils adoptent notre [liturgical_language|e] !"
 ism_change_subject_liturgical_language_act: "Changer la langue liturgique dans [SCOPE.sCountry('recipient').GetName]"
 ism_change_subject_liturgical_language_effect_text: "[SCOPE.sCountry('actor').GetName] modifier le [liturgical_language|e] en [SCOPE.sCountry('recipient').GetName]"
 ism_change_subject_liturgical_language_effect_text_past: "[SCOPE.sCountry('actor').GetName] a changé le [liturgical_language|e] en [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_change_subject_liturgical_language: "Modifier [liturgical_language|e] en $RECIPIENT$?\N$INFO$."

 # Block subject colonization
 ism_block_subject_colonization: "Colonisation en bloc"
 ism_block_subject_colonization_desc: "Nous empêcherons notre sujet de créer de nouveaux [colonial_charters|e]."
 ism_block_subject_colonization_act: "Bloque la colonisation"
 ism_block_subject_colonization_effect_text: "[SCOPE.sCountry('actor').GetName] bloque la colonisation de [SCOPE.sCountry('recipient').GetName]"
 ism_block_subject_colonization_effect_text_past: "[SCOPE.sCountry('actor').GetName] bloque maintenant la colonisation de [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_block_subject_colonization: "Bloquer la colonisation de $TARGET$ ?"

 # Allow subject colonization
 allow_subject_colonization: "Permettre la colonisation"
 allow_subject_colonization_desc: "Nous allons permettre à notre sujet de créer un nouveau [colonial_charters|e]."
 allow_subject_colonization_act: "Permet la colonisation"
 allow_subject_colonization_effect_text: "[SCOPE.sCountry('actor').GetName] permet la colonisation de [SCOPE.sCountry('recipient').GetName]"
 allow_subject_colonization_effect_text_past: "[SCOPE.sCountry('actor').GetName] ne bloque plus la colonisation de [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_allow_subject_colonization: "Autoriser la colonisation de $TARGET$ ?"

 # Block subject urbanization
 ism_block_subject_urbanization: "Urbanisation en bloc"
 ism_block_subject_urbanization_desc: "Nous empêcherons notre sujet de créer de nouvelles villes."
 ism_block_subject_urbanization_act: "Blocs Urbanisation"
 ism_block_subject_urbanization_effect_text: "[SCOPE.sCountry('actor').GetName] bloque l'urbanisation de [SCOPE.sCountry('recipient').GetName]"
 ism_block_subject_urbanization_effect_text_past: "[SCOPE.sCountry('actor').GetName] bloque désormais l'urbanisation de [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_ism_block_subject_urbanization: "Urbanisation en bloc de $TARGET$ ?"

 # Allow subject urbanization
 allow_subject_urbanization: "Permettre l'urbanisation"
 allow_subject_urbanization_desc: "Nous allons permettre à notre sujet de créer de nouvelles villes."
 allow_subject_urbanization_act: "Permet l'urbanisation"
 allow_subject_urbanization_effect_text: "[SCOPE.sCountry('actor').GetName] permet l'urbanisation de [SCOPE.sCountry('recipient').GetName]"
 allow_subject_urbanization_effect_text_past: "[SCOPE.sCountry('actor').GetName] ne bloque plus l'urbanisation de [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_allow_subject_urbanization: "Autoriser l'urbanisation de $TARGET$ ?"

 # Block subject declaring war
 ism_block_subject_declaring_war: "Bloc Déclarer la guerre"
 ism_block_subject_declaring_war_desc: "Nous empêcherons notre sujet de déclarer la guerre."
 ism_block_subject_declaring_war_act: "Blocs déclarant la guerre"
 ism_block_subject_declaring_war_effect_text: "[SCOPE.sCountry('actor').GetName] empêche [SCOPE.sCountry('recipient').GetName] de déclarer la guerre"
 ism_block_subject_declaring_war_effect_text_past: "[SCOPE.sCountry('actor').GetName] empêche maintenant [SCOPE.sCountry('recipient').GetName] de déclarer la guerre"
 PROPOSE_ism_block_subject_declaring_war: "Empêcher $TARGET$ de déclarer la guerre ?"

 # Allow subject declaring war
 allow_subject_declaring_war: "Autoriser la déclaration de guerre"
 allow_subject_declaring_war_desc: "Nous autoriserons notre sujet à déclarer la guerre."
 allow_subject_declaring_war_act: "Permet de déclarer la guerre"
 allow_subject_declaring_war_effect_text: "[SCOPE.sCountry('actor').GetName] permet à [SCOPE.sCountry('recipient').GetName] de déclarer la guerre"
 allow_subject_declaring_war_effect_text_past: "[SCOPE.sCountry('actor').GetName] n'empêche plus [SCOPE.sCountry('recipient').GetName] de déclarer la guerre"
 PROPOSE_allow_subject_declaring_war: "Autoriser $TARGET$ à déclarer la guerre ?"
